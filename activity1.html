<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Understanding methods</h1>
    <script>
        var scr= "cOdInG";
        document.write(scr.toLowerCase());
        document.write("<br>");
        document.write(scr.toUpperCase());
        document.write("<br>");
        document.write(scr.startsWith("k"));
        document.write("<br>");
        var s1="I like hot chocolate";
        var patt=new RegExp ("like");
        var res=patt.test(s1);
        document.write(res);
        document.write("<br>");
        var fruits=["blueberry","grape","watermelon","melon"];
        var text="";
        var i;
        for (i=0;i<fruits.length;i++){
            text+=fruits[i]+"<br>";
        }
        document.write(text);
    </script>
</body>
</html>
